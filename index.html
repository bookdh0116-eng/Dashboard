/* page themes (light values); dark values follow after the base dark blocks */
:root[data-pilsa="night"]{--paper:#F2F4F9;--meadow:#2E4A8A;--meadow-soft:#E3E9F5;--rule:#ECEFF6;--night-a:#1B2A5A;--night-b:#0E1530;--star:#F5C431}
:root[data-pilsa="sakura"]{--paper:#FAF4F3;--meadow:#B04A6A;--meadow-soft:#F8E4EB;--rule:#F4EAEC;--night-a:#7A4470;--night-b:#2E1B34;--star:#FFD0DE}
:root[data-pilsa="sunset"]{--paper:#FAF5EE;--meadow:#B4561F;--meadow-soft:#F7E6D6;--rule:#F3EBE0;--night-a:#8A4632;--night-b:#2A1A2C;--star:#FFC56B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14171C; --page:#1C2027; --ink:#ECE9DF; --muted:#A2A79C; --line:#2E343D; --rule:#232830;
  --meadow:#9CBB83; --meadow-soft:#25301F; --wire:#5D635C; --warn:#E08A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171C; --page:#1C2027; --ink:#ECE9DF; --muted:#A2A79C; --line:#2E343D; --rule:#232830;
  --meadow:#9CBB83; --meadow-soft:#25301F; --wire:#5D635C; --warn:#E08A62; color-scheme:dark}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-pilsa="night"]{--paper:#11141C;--page:#191E2A;--meadow:#93AEE6;--meadow-soft:#1E2944;--rule:#20263A}
  :root:not([data-theme="light"])[data-pilsa="sakura"]{--paper:#171214;--page:#21191D;--meadow:#E79AB3;--meadow-soft:#3A2230;--rule:#2C2127}
  :root:not([data-theme="light"])[data-pilsa="sunset"]{--paper:#16130F;--page:#211C16;--meadow:#EBA172;--meadow-soft:#3A2717;--rule:#2C241B}}
:root[data-theme="dark"][data-pilsa="night"]{--paper:#11141C;--page:#191E2A;--meadow:#93AEE6;--meadow-soft:#1E2944;--rule:#20263A}
:root[data-theme="dark"][data-pilsa="sakura"]{--paper:#171214;--page:#21191D;--meadow:#E79AB3;--meadow-soft:#3A2230;--rule:#2C2127}
:root[data-theme="dark"][data-pilsa="sunset"]{--paper:#16130F;--page:#211C16;--meadow:#EBA172;--meadow-soft:#3A2717;--rule:#2C241B}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
#app{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--meadow);outline-offset:2px}
.notebook{background:var(--page);border:1px solid var(--line);border-radius:6px 6px 10px 10px;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(20,30,20,.35);position:relative;padding-top:26px}
.spiral{position:absolute;top:-12px;left:18px;right:18px;height:28px;
  background:radial-gradient(ellipse 5px 11px at 50% 50%,transparent 3px,var(--wire) 3.6px,var(--wire) 5px,transparent 5.6px) 0 0/22px 28px repeat-x}
.spiral::after{content:"";position:absolute;left:0;right:0;top:19px;height:8px;
  background:radial-gradient(circle at 50% 50%,var(--paper) 3px,transparent 3.5px) 0 0/22px 8px repeat-x}
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;padding:12px 22px 22px}
.cover-left{display:flex;gap:18px;align-items:stretch;border:1px solid var(--line);border-radius:4px;padding:20px 20px 18px;min-height:230px}
.vtitle{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:.18em;color:var(--meadow);margin:0;line-height:1}
.vsub{writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.cover-meta{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0;margin-left:auto;text-align:right}
.cover-meta .cls{font-family:var(--f-display);font-size:20px;font-weight:700}
.cover-meta .period{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sky{position:relative;overflow:hidden;border-radius:4px;background:radial-gradient(120% 90% at 70% 110%,#3B4F9A 0%,transparent 55%),linear-gradient(165deg,var(--night-a),var(--night-b));color:var(--on-night);padding:22px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:end;min-height:230px}

function card(sched){
  if(!state.students.length)return '<div class="empty">학생 명단이 비어 있어요.</div>';
  var opts='<option value="">이름을 고르세요</option>'+state.students.map(function(s,i){return '<option value="'+s.id+'"'+(view.student===s.id?' selected':'')+'>'+(i+1)+'. '+esc(s.name)+'</option>'}).join('');
  var head='<div class="card-head"><label for="student-pick">학생 선택<select id="student-pick" data-act="pick">'+opts+'</select></label></div>';
  var s=state.students.find(function(x){return x.id===view.student});
  if(!s)return head+'<div class="empty">이름을 고르면 그동안 받은 도장이 한 장의 카드로 보여요.</div>';
  var elapsed=sched.filter(function(x){return x.date<=TODAY});
  var done=sched.filter(function(x){return has(s.id,x.date)}).length;
  var streak=0;for(var i=elapsed.length-1;i>=0;i--){if(has(s.id,elapsed[i].date))streak++;else if(elapsed[i].date===TODAY)continue;else break}
  var pct=elapsed.length?Math.round(done*100/elapsed.length):0;
  var rounds=sched.map(function(x){var on=has(s.id,x.date),key=s.id+'|'+x.date;
    return '<div class="round'+(x.date===TODAY?' today':'')+'"><div class="disc">'+(on?stampSvg('full',key,x.round+'회차 완료'):'<span class="slot'+(x.date>TODAY?' future':'')+'">'+x.round+'</span>')+'</div><small>'+x.round+'회 · '+md(x.date)+'</small></div>'}).join('');
  return head+'<div class="card-page"><div class="card-title"><h2>'+esc(s.name)+'</h2>'+
    '<span class="kpi">받은 도장 <b>'+done+'</b> / '+elapsed.length+'회</span>'+
    '<span class="kpi">연속 <b>'+streak+'</b>일</span><span class="kpi">달성률 <b>'+pct+'</b>%</span></div>'+
    '<div class="progress" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div>'+
    '<div class="rounds">'+rounds+'</div></div>';
}

function toggle(sid,date,force){
  var set=stampSet[sid]||(stampSet[sid]=new Set());var on=set.has(date);var want=force==null?!on:force;
  if(want===on)return;
  if(want)set.add(date);else set.delete(date);
  var k=sid+'|'+date;if(changes.has(k))changes.delete(k);else changes.add(k);
  if(want)justStamped=k;
}

    var rosterChanged=next.map(function(s){return s.id}).join()!==state.students.map(function(s){return s.id}).join()||next.some(function(s,i){return state.students[i]&&s.name!==state.students[i].name});
    if(rosterChanged)state.sample=false;
    state.students=next;state.noteTitle=f.title||'필사를 하다';state.className=f.cls;state.subtitle=f.sub;state.start=f.start;state.end=f.end;state.firstRound=f.first;
    state.skipWeekends=f.weekend;state.holidays=f.hols;state.stampColor=f.color;state.stampTop=f.top;state.stampBottom=f.bot;state.theme=f.theme;
    settingsDirty=true;view.month=null;close();render();
    toast(newPin?'비밀번호를 정했어요. 저장하기를 눌러야 적용돼요.':pinOff?'비밀번호를 없앴어요. 저장하기를 눌러야 적용돼요.':'설정을 적용했어요. 저장하기를 눌러 반영하세요.');
  };
  q('f-title').focus();
}

function snapshot(){
  var out={};
  Object.keys(state).forEach(function(k){out[k]=state[k]});
  out.stamps={};Object.keys(stampSet).forEach(function(k){if(stampSet[k].size)out.stamps[k]=Array.from(stampSet[k]).sort()});
  return out;
}

/* backup: download the whole record as JSON (restorable) or CSV (for Excel), and restore from a JSON backup */
var downloadsNs=null;
async function offerFile(filename,data){
  if(downloadsNs){
    try{await downloadsNs.save({filename:filename,data:data});toast('파일을 저장했어요.');return}
    catch(e){var c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('잠시 뒤 다시 눌러 주세요.');return}
      toast('이 화면에서는 파일을 저장할 수 없어요.');return}}
  try{var url=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(filename)?'text/csv':'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)}
  catch(e){toast('파일을 저장하지 못했어요.')}
}
function backupJson(){return JSON.stringify({app:'pilsa-stamp',version:1,exportedAt:new Date().toISOString(),state:snapshot()},null,1)}
function backupCsv(){
  var sched=schedule(),q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['번호','이름'].concat(sched.map(function(x){return x.round+'회('+md(x.date)+')'}),['완료 수','진행 회차'])];
  var elapsed=sched.filter(function(x){return x.date<=TODAY}).length;
  state.students.forEach(function(s,i){var n=0;
    var cells=sched.map(function(x){if(has(s.id,x.date)){n++;return 'O'}return ''});
    rows.push([i+1,s.name].concat(cells,[n,elapsed]))});
  return '﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\r\n');
}
function stampName(ext){return '필사도장판-'+(state.className?state.className.replace(/[\\/:*?"<>|]/g,'')+'-':'')+TODAY+'.'+ext}
function restore(text){
  var o;try{o=JSON.parse(text)}catch(e){return '백업 파일을 읽지 못했어요. 이 페이지에서 저장한 .json 파일인지 확인해 주세요.'}
  var s=o&&o.app==='pilsa-stamp'&&o.state?o.state:o;
  if(!s||!Array.isArray(s.students)||typeof s.stamps!=='object'||!s.start||!s.end)return '필사 도장판 백업 파일이 아니에요.';
  var ok=s.students.every(function(x){return x&&typeof x.id==='string'&&typeof x.name==='string'});
  if(!ok)return '백업 파일의 학생 명단이 올바르지 않아요.';
  var keep=['teacherPin','noteTitle','subtitle','className','start','end','firstRound','skipWeekends','holidays','stampTop','stampBottom','stampColor','theme','students','nextId','sample','updatedAt'];
  keep.forEach(function(k){if(k in s)state[k]=s[k]});
  state.holidays=Array.isArray(state.holidays)?state.holidays:[];
  var maxId=0;state.students.forEach(function(x){var m=/^s(\d+)$/.exec(x.id);if(m)maxId=Math.max(maxId,+m[1])});
  state.nextId=Math.max(Number(state.nextId)||1,maxId+1);
  Object.keys(stampSet).forEach(function(k){delete stampSet[k]});
  Object.keys(s.stamps||{}).forEach(function(k){if(Array.isArray(s.stamps[k]))stampSet[k]=new Set(s.stamps[k].filter(function(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)}))});
  changes.clear();settingsDirty=true;view.month=null;
  return '';
}
function openBackup(){
  var bg=document.createElement('div');bg.className='modal-bg';
  var n=state.students.length,cnt=0;Object.keys(stampSet).forEach(function(k){cnt+=stampSet[k].size});
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="bk-h"><h3 id="bk-h">백업</h3>'+
  '<p class="note">지금 화면의 기록(학생 '+n+'명, 도장 '+cnt+'개, 설정)을 파일로 받아 두거나, 받아 둔 파일로 되돌릴 수 있어요.</p>'+
  '<div class="form">'+
  '<div class="full bk-row"><div><b>백업 파일 저장</b><span class="hint">나중에 그대로 되돌릴 수 있는 파일(.json)이에요.</span></div><button class="btn primary" type="button" id="bk-json">백업 저장</button></div>'+
  '<div class="full bk-row"><div><b>엑셀용 표 저장</b><span class="hint">학생별 회차 도장을 O로 표시한 표(.csv)예요. 엑셀에서 열 수 있어요.</span></div><button class="btn" type="button" id="bk-csv">표 저장</button></div>'+
  '<div class="full bk-row"><div><b>백업 불러오기</b><span class="hint">지금 기록을 백업 파일 내용으로 바꿔요. 불러온 뒤 저장하기를 눌러야 반영돼요.</span></div><label class="btn" for="bk-file" style="cursor:pointer">파일 고르기</label><input type="file" id="bk-file" accept=".json,application/json" class="vh"></div>'+
  '<p class="err full" id="bk-err" hidden></p></div>'+
  '<div class="actions"><button class="btn" id="bk-close" type="button">닫기</button></div></div>';
  document.body.appendChild(bg);
  var q=function(id){return bg.querySelector('#'+id)};
  function close(){bg.remove();var b=app.querySelector('[data-act=backup]');if(b)b.focus()}
  q('bk-close').onclick=close;
  bg.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  bg.addEventListener('click',function(e){if(e.target===bg)close()});
  q('bk-json').onclick=function(){offerFile(stampName('json'),backupJson())};
  q('bk-csv').onclick=function(){offerFile(stampName('csv'),backupCsv())};
  q('bk-file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
    var err=q('bk-err');err.hidden=true;
    if(!confirm('지금 도장판 기록을 "'+f.name+'" 내용으로 바꿀까요?\n불러온 뒤 저장하기를 눌러야 학생 화면에 반영돼요.')){e.target.value='';return}
    f.text().then(function(t){var m=restore(t);if(m){err.textContent=m;err.hidden=false;e.target.value='';return}
      close();render();toast('백업을 불러왔어요. 확인한 뒤 저장하기를 눌러 주세요.')})
    .catch(function(){err.textContent='파일을 읽지 못했어요.';err.hidden=false});
  });
  q('bk-json').focus();
}

function openUnlock(){
  var bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML='<div class="modal" style="max-width:380px" role="dialog" aria-modal="true" aria-labelledby="ul-h"><h3 id="ul-h">교사 모드</h3><p class="note">비밀번호를 넣어 주세요.</p>'+
  '<form class="form" id="ul-form" style="grid-template-columns:minmax(0,1fr)"><label>비밀번호<input type="password" id="ul-pw" autocomplete="current-password"></label><p class="err" id="ul-err" hidden></p></form>'+
  '<div class="actions"><button class="btn" type="button" id="ul-cancel">취소</button><button class="btn primary" type="submit" form="ul-form" id="ul-ok">들어가기</button></div></div>';
  document.body.appendChild(bg);
  var q=function(id){return bg.querySelector('#'+id)};
  function close(){bg.remove();var b=app.querySelector('[data-act=unlock]')||app.querySelector('[data-act=settings]');if(b)b.focus()}
  q('ul-cancel').onclick=close;
  bg.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  bg.addEventListener('click',function(e){if(e.target===bg)close()});
  q('ul-form').addEventListener('submit',async function(e){e.preventDefault();
    var p=state.teacherPin,err=q('ul-err'),ok=q('ul-ok');if(!p){close();return}
    ok.disabled=true;var h='';try{h=await pinHash(q('ul-pw').value,p.salt,p.iter||200000)}catch(x){}ok.disabled=false;
    if(h&&h===p.hash){setUnlocked(true);studentPreview=false;close();render();toast('교사 모드로 들어왔어요.')}
    else{err.textContent=h?'비밀번호가 맞지 않아요.':'이 브라우저에서는 확인할 수 없어요.';err.hidden=false;q('ul-pw').select()}
  });
  q('ul-pw').focus();
}

function buildDoc(){
  var out=snapshot();
  out.updatedAt=new Date().toISOString();
  var json=JSON.stringify(out).replace(/</g,'\\u003c');
  var css=document.getElementById('page-css').textContent;
  var js=document.getElementById('page-js').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '\n<title>필사 도장판</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINKS+'\n<style id="page-css">'+css+'</style>\n<div id="app"></div>\n'+
    '<script type="application/json" id="pilsa-state">'+json+'<\/script>\n<script id="page-js">'+js+'<\/script>\n</body></html>';
}

async function save(){
  if(saving)return;
  if(!artifactNs){toast('미리보기에서는 저장할 수 없어요. 게시된 페이지에서 저장해 주세요.');return}
  saving=true;render();
  try{await artifactNs.publish(buildDoc());changes.clear();settingsDirty=false;toast('저장했어요. 최신 도장판을 다시 불러옵니다.')}
  catch(e){var c=e&&e.code;saving=false;
    if(c==='conflict'){changes.clear();settingsDirty=false;toast('다른 곳에서 먼저 저장했어요. 최신 판으로 다시 불러오니 방금 찍은 도장은 다시 확인해 주세요.')}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){canWrite=false;render();toast('이 화면은 보기 전용이에요.')}
    else if(c==='rate_limited'){render();toast('저장이 너무 잦아요. 잠시 뒤 다시 눌러 주세요.')}
    else if(c==='too_large'){render();toast('기록이 너무 커서 저장하지 못했어요.')}
    else{render();toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.')}
    return}
  saving=false;
}

render();
(async function(){
  if(!window.claude||typeof window.claude.use!=='function'){previewOnly=true;canWrite=true;render();return}
  try{
    var r=await Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('downloads')]);
    artifactNs=r[1];downloadsNs=r[2];
    var ce=r[0]?await r[0].canEdit():false;
    if(artifactNs&&ce){canWrite=true;render()}
  }catch(e){}
})();
})();
</script>
